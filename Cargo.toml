[package]
name = "vimurai"
version = "0.1.0"
edition = "2024"
description = "Master Vim through muscle memory in a cyberpunk terminal dojo"
license = "GPL-2.0-only"
rust-version = "1.88"
exclude = ["src_old/**", "scratch/**"]

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
dirs = "5.0.1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
termina = "0.3.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
