[package]
name = "vimurai"
version = "0.1.0"
edition = "2024"
description = "Master Vim through muscle memory with interactive CLI training"
authors = ["Vimurai Team"]

[dependencies]
# TUI
ratatui = "0.26"
crossterm = "0.28"

# Async support for future features
tokio = { version = "1", features = ["full"] }

# Database for progress tracking
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Command parsing and utilities
nom = "7"

# File system operations
dirs = "5"

# Color support
ansi-to-tui = "4"

# Time utilities
chrono = { version = "0.4", features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
